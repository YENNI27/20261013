<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡水北海岸生態環境科學教育</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050814;
        }

        /* --- SVG Background Effect Container --- */
        .svg-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .svg-bg-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI Overlay Styles --- */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .fade-title {
            animation: fadeInOut 4s ease-in-out infinite;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body class="relative flex flex-col min-h-screen text-slate-100">

    <div class="svg-bg-container">
        <svg xmlns="http://www.w3.org/2000/svg" style="background:linear-gradient(pink, #ff0, red)" preserveAspectRatio="none" viewBox="0 0 1000 1000">
            <filter id="filter">
                <feTurbulence type="fractalNoise" baseFrequency=".003 .05" numOctaves="3" result="n"/>
                <feDisplacementMap in="SourceGraphic" scale="50"/>
                <feBlend in="n" mode="overlay"/>
            </filter>
            <g fill="#f88b" filter="url(#filter)">
                <circle id="c" cx="50%" cy="50%" r="71%"/>
            </g>
            <circle id="s" cx="50%" cy="50%" r="9%" fill="#fc0"/>
            <g filter="url(#filter)" clip-path="inset(50% 0 0)">
                <use href="#c" fill="#47fb"/>
                <use href="#s" y="-38%" transform="scale(1 4)"/>
            </g>
        </svg>
    </div>

    <header class="relative z-20 flex justify-between items-center p-6 md:px-12 w-full">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-cyan-700 flex items-center justify-center text-white font-bold shadow-lg">
                🌊
            </div>
            <span class="text-xl font-bold tracking-wider text-white drop-shadow-md">淡水北海岸生態教育</span>
        </div>
        
        <button id="audioToggle" class="glass-panel px-5 py-2.5 rounded-full text-slate-800 font-medium text-sm shadow-md hover:bg-white transition-all flex items-center gap-2 cursor-pointer">
            <span id="audioIcon">🔊</span>
            <span id="audioText">開啟海浪音效</span>
        </button>
    </header>

    <main class="relative z-20 flex-grow flex flex-col items-center justify-center px-4 py-8 text-center">
        <div class="glass-panel px-6 py-5 rounded-2xl shadow-2xl max-w-2xl mx-auto mb-6">
            <h1 class="fade-title text-2xl md:text-4xl font-bold text-black tracking-wide">
                淡水北海岸生態環境科學教育
            </h1>
            <p class="mt-2 text-sm md:text-base text-slate-700 font-medium">
                探索潮間帶、河口生態與永續海洋環境
            </p>
        </div>

        <div class="w-full max-w-3xl glass-panel p-4 rounded-2xl shadow-2xl">
            <div id="canvas-container" class="w-full rounded-xl overflow-hidden shadow-inner bg-black/60 relative sketchfab-embed-wrapper" style="height: 450px;">
                <iframe title="Haloween Turtle" frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share src="https://sketchfab.com/models/c4f1551efef8487a917e0264e9d877e2/embed" style="width: 100%; height: 100%; border: none;"> </iframe>
            </div>
            <p style="font-size: 13px; font-weight: normal; margin: 8px 0 2px 0; color: #4A4A4A;" class="text-center">
                <a href="https://sketchfab.com/3d-models/haloween-turtle-c4f1551efef8487a917e0264e9d877e2" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;"> Haloween Turtle </a> by <a href="https://sketchfab.com/Batuhan13" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;"> Batuhan13 </a> on <a href="https://sketchfab.com" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">Sketchfab</a>
            </p>
        </div>
    </main>

    <footer class="relative z-20 p-6 text-center text-slate-200 text-xs md:text-sm drop-shadow">
        <p>© 2026 淡水北海岸生態教育中心 | 點擊右上角按鈕即可聆聽沈浸式海浪白噪音</p>
    </footer>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let noiseNode = null;
        let gainNode = null;
        let filterNode = null;

        function setupOceanSound() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.11;
                b6 = white * 0.115926;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(300, audioCtx.currentTime);

            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start(0);

            let waveCycle = 0;
            setInterval(() => {
                if (!isPlaying) return;
                waveCycle += 0.05;
                let cutoff = 250 + Math.sin(waveCycle) * 200;
                let vol = 0.08 + Math.sin(waveCycle) * 0.06;
                if (filterNode && gainNode) {
                    filterNode.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.5);
                    gainNode.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.5);
                }
            }, 200);
        }

        const audioToggleBtn = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        audioToggleBtn.addEventListener('click', () => {
            setupOceanSound();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isPlaying = !isPlaying;
            if (isPlaying) {
                if (gainNode) gainNode.gain.setTargetAtTime(0.1, audioCtx.currentTime, 0.5);
                audioIcon.textContent = '🔇';
                audioText.textContent = '關閉海浪音效';
                audioToggleBtn.classList.add('bg-cyan-100', 'border-cyan-400');
            } else {
                if (gainNode) gainNode.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.5);
                audioIcon.textContent = '🔊';
                audioText.textContent = '開啟海浪音效';
                audioToggleBtn.classList.remove('bg-cyan-100', 'border-cyan-400');
            }
        });
    </script>
</body>
</html>
